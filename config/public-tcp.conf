[reticulum]
  enable_transport = No
  share_instance = No
  panic_on_interface_error = No
  instance_control_port = 37428
  instance_data_port = 37428

[interfaces]
  [[ReticulumNet Netherlands]]
    type = TCPClientInterface
    enabled = Yes
    target_host = node.reticulumnet.nl
    target_port = 4242

  [[RMAP World]]
    type = TCPClientInterface
    enabled = Yes
    target_host = rmap.world
    target_port = 4242

